# vana-dash: development stack
# Run from the repository root: docker compose -f infra/docker-compose.yml up -d
# Postgres listens on 5433 on the host, so it does not collide with another local instance.
name: vana-dash-dev

services:
  postgres:
    image: postgres:15-alpine
    # A cap on temporary files per query: a runaway query fails instead of filling the disk.
    # (A recursive CTE over a folder tree with a cycle once wrote about 700 GB.)
    command: postgres -c temp_file_limit=5GB
    environment:
      POSTGRES_USER: vanadash
      POSTGRES_PASSWORD: vanadash
      POSTGRES_DB: vanadash
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vanadash']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache chromium nss freetype harfbuzz ca-certificates postgresql-client curl poppler-utils && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @vana-dash/backend db:migrate && pnpm --filter @vana-dash/backend dev"
    environment:
      DATABASE_URL: postgres://vanadash:vanadash@postgres:5432/vanadash
    env_file:
      - ../.env
    ports:
      - '3001:3001'
    volumes:
      - ..:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @vana-dash/frontend dev -- --host 0.0.0.0"
    environment:
      # The Vite proxy targets the backend on the compose network
      VITE_BACKEND_URL: http://backend:3001
    ports:
      - '5174:5174'
    volumes:
      - ..:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
