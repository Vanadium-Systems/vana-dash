name: CI

# Runs on GitHub's runner, never on the production server, and uses no secrets:
# pull requests from forks get exactly the same job.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway values: the test database lives and dies with each job. At workflow level because a
# frontend test (pricing) imports backend code that reads this config when loaded.
env:
  NODE_ENV: test
  DATABASE_URL: postgres://vanadash:vanadash@localhost:5433/vanadash
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ci-only-password-123
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
  # Quoted: an unquoted run of digits is a YAML number, and the key would arrive as "0".
  MASTER_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  FRONTEND_ORIGIN: http://localhost:5174

jobs:
  # Split so the slow part runs side by side: the backend suite is sequential (its files share one
  # database), 3 minutes in a single job. Each shard below gets its own Postgres instead.
  static:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test-frontend:
    name: test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vana-dash/frontend test

  test-backend:
    name: test (backend ${{ matrix.shard }}/3, RLS ${{ matrix.rls }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        # Production runs with RLS on, as the vanadash_app role; off stays covered until every
        # installation has switched.
        rls: [off, on]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vanadash
          POSTGRES_PASSWORD: vanadash
          POSTGRES_DB: vanadash
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vanadash"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pdftoppm renders the PDF thumbnails in the Archive; one test exercises it for real.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - if: matrix.rls == 'on'
        run: bash scripts/rls-role.sh
        env:
          APP_DB_PASSWORD: ciThrowawayAppRolePassword2026
          PSQL: psql -h localhost -p 5433 -U vanadash
          PGPASSWORD: vanadash
          DB: vanadash
          OWNER: vanadash
      - run: pnpm --filter @vana-dash/backend exec vitest run --shard=${{ matrix.shard }}/3
        env:
          RLS_ENABLED: ${{ matrix.rls == 'on' }}
          DATABASE_URL_APP: ${{ matrix.rls == 'on' && 'postgres://vanadash_app:ciThrowawayAppRolePassword2026@localhost:5433/vanadash' || '' }}

  # The "test as an employee" (sprint profile): a non-admin role opens every page in its menu, and any
  # 403 / 5xx fails the job. Missed by hand four times; the admin sees everything and proves nothing.
  # API without cron jobs (e2e/api-server.ts), so nothing calls BNR / ANAF / SICAP from the runner.
  employee:
    name: test as an employee (RLS on)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vanadash
          POSTGRES_PASSWORD: vanadash
          POSTGRES_DB: vanadash
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vanadash"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RLS_ENABLED: true
      DATABASE_URL_APP: postgres://vanadash_app:ciThrowawayAppRolePassword2026@localhost:5433/vanadash
      E2E_BASE: http://localhost:5174
      E2E_EMAIL: ana@example.com
      E2E_PASSWORD: ci-employee-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed:demo
      - run: bash scripts/rls-role.sh
        env:
          APP_DB_PASSWORD: ciThrowawayAppRolePassword2026
          PSQL: psql -h localhost -p 5433 -U vanadash
          PGPASSWORD: vanadash
          DB: vanadash
          OWNER: vanadash
      # Ana ("Sales (demo)") gets a random password from the seed; give her a known one.
      - name: password for the demo employee
        working-directory: backend
        env:
          PGPASSWORD: vanadash
        run: |
          hash=$(node -e "import('argon2').then((a) => a.default.hash(process.env.E2E_PASSWORD)).then((h) => console.log(h))")
          echo "update users set password_hash = :'hash' where email = '$E2E_EMAIL';" \
            | psql -h localhost -p 5433 -U vanadash -d vanadash -v ON_ERROR_STOP=1 -v hash="$hash"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: e2e
      - name: start API and frontend
        run: |
          backend/node_modules/.bin/tsx e2e/api-server.ts > api.log 2>&1 &
          pnpm --filter @vana-dash/frontend exec vite --port 5174 --strictPort > vite.log 2>&1 &
          timeout 90 bash -c 'until curl -sf localhost:3001/health && curl -sf -o /dev/null localhost:5174; do sleep 2; done'
      - run: node e2e/employee.mjs
      - if: failure()
        run: tail -n 100 api.log vite.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: employee-screenshots
          path: e2e/out/
          retention-days: 7
