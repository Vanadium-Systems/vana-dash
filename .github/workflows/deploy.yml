name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ghcr.io/vanadium-systems/vana-dash-backend

jobs:
  # Images and the SPA are built here, not on the VPS: the box has 1 vCPU and 1.9 GB with no
  # swap, and a build there starved the running app for ~4 minutes on every push.
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          # Links the package to this repository, so the job token of later runs can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The whole workspace: the SPA imports shared code from backend/src (pricing calc), whose types need backend deps.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vana-dash/frontend build

      - run: tar -czf frontend-dist.tgz -C frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tgz
          retention-days: 7

  deploy:
    name: Deploy vana-dash
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Upload the SPA to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend-dist.tgz
          target: /home/${{ secrets.VPS_USER }}/vana-dash-releases

      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script: |
            set -e
            git -C "$HOME/vana-dash" fetch origin main
            git -C "$HOME/vana-dash" reset --hard origin/main
            BACKEND_IMAGE="$IMAGE" FRONTEND_TARBALL="$HOME/vana-dash-releases/frontend-dist.tgz" \
              SKIP_GIT_PULL=1 bash "$HOME/vana-dash/scripts/deploy-prod.sh"

  # Does this push touch anything native? Everything else (backend, web UI) reaches the APK
  # live when it is reopened, with no reinstall, so rebuilding on every push only cost five
  # minutes for nothing. Needs nothing, so it runs next to the builds.
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'frontend/android/**'
              - 'frontend/capacitor.config.ts'
              - 'frontend/package.json'

  # The Capacitor APK is a thin shell that loads the deployed web app, so a native rebuild
  # matters only when plugins, the manifest or versionCode change (the `changes` job above).
  # Runs next to the deploy. The canonical copy is ~/vana-dash-secrets/vanadash.apk, which
  # deploy-prod.sh puts back into the freshly emptied dist/; writing the canonical copy first and
  # dist/ second leaves the new APK served whichever of the two jobs finishes last. Writing only
  # dist/ (as before) lost every new APK at the next deploy, to a copy from August.
  # Signed for release with the key from secrets.
  apk:
    name: Build + publish APK
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @vana-dash/frontend build

      - name: Sync Capacitor Android
        run: pnpm --filter @vana-dash/frontend exec cap sync android

      - name: Restore google-services.json
        # The file is gitignored (Firebase client config belongs to the project, not the code)
        # and comes from a secret here. Without it FCM does not initialise and the APK crashes
        # on start, so fail loudly rather than ship a broken APK.
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 lipsește — APK-ul ar crăpa fără config Firebase"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > frontend/android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Restore release signing
        run: |
          mkdir -p "$HOME/vana-dash-secrets"
          echo "$VANADASH_KEYSTORE_B64" | base64 -d > "$HOME/vana-dash-secrets/vanadash-release.keystore"
          # storeFile in the properties is an absolute path from a developer machine; rewritten for the runner
          echo "$VANADASH_SIGNING_PROPS_B64" | base64 -d \
            | sed "s|^storeFile=.*|storeFile=$HOME/vana-dash-secrets/vanadash-release.keystore|" \
            > "$HOME/vana-dash-secrets/vanadash-signing.properties"
          chmod 600 "$HOME/vana-dash-secrets"/*
        env:
          VANADASH_KEYSTORE_B64: ${{ secrets.VANADASH_KEYSTORE_B64 }}
          VANADASH_SIGNING_PROPS_B64: ${{ secrets.VANADASH_SIGNING_PROPS_B64 }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: cp frontend/android/app/build/outputs/apk/release/app-release.apk vanadash.apk

      - name: Upload APK to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: vanadash.apk
          target: /home/${{ secrets.VPS_USER }}/vana-dash-releases/apk
          strip_components: 0

      - name: Publish APK
        # mv within one filesystem is atomic, so neither the deploy nor a download ever reads a
        # half-written file.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p "$HOME/vana-dash-secrets" "$HOME/vana-dash/frontend/dist"
            mv "$HOME/vana-dash-releases/apk/vanadash.apk" "$HOME/vana-dash-secrets/vanadash.apk"
            # A deploy emptying dist/ right now restores the canonical copy itself.
            { cp "$HOME/vana-dash-secrets/vanadash.apk" "$HOME/vana-dash/frontend/dist/.vanadash.apk.tmp" \
              && mv "$HOME/vana-dash/frontend/dist/.vanadash.apk.tmp" "$HOME/vana-dash/frontend/dist/vanadash.apk"; } \
              || echo "dist/ was being rewritten; deploy-prod.sh puts the canonical APK back"
